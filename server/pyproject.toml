[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dittobuffer"
version = "1.0.0"
description = "Private, self-hosted Pokemon GO 0.429.2 server, admin console and APK patcher"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Dittobuffer contributors" }]
keywords = ["pokemon-go", "server", "protobuf", "frida", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "protobuf>=7.36.2",
    "s2sphere>=0.2.5",
    "cryptography>=42.0",
    "tzdata>=2024.1",
    "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "grpcio-tools>=1.60", "pyelftools>=0.31", "androguard>=4.1", "frida>=17", "capstone>=5"]
world = ["osmium>=4.0", "shapely>=2.0", "astral>=3.2", "tzdata"]
assets = ["UnityPy>=1.20", "Pillow>=11"]

[project.scripts]
dittobuffer = "dittobuffer.cli.console:main"

[project.urls]
Documentation = "https://github.com/Dittobuffer/dittobuffer#readme"
Source = "https://github.com/Dittobuffer/dittobuffer"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dittobuffer = [
    "**/*.json",
    "**/*.html",
    "**/*.css",
    "**/*.js",
    "**/*.png",
    "**/*.jks",
    "**/*.pem",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "E401", "F401", "F403", "F405"]
