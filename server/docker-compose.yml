name: dittobuffer

services:
  server:
    build: .
    image: dittobuffer/server:1.1.0
    container_name: dittobuffer-server
    command: ["python", "-m", "dittobuffer.runtime.http", "--config", "config/server.json"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8445:8445"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./config:/app/config:ro
      - ./protocol:/app/protocol:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Europe/Amsterdam
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8445),3);s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  admin:
    image: dittobuffer/server:1.1.0
    container_name: dittobuffer-admin
    depends_on:
      server:
        condition: service_started
    command: ["python", "-m", "dittobuffer.admin.admin", "--config", "config/server.json", "--port", "8080"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      TZ: Europe/Amsterdam
