name: dittobuffer-riscv64

# Usage on a riscv64 host (or with Docker buildx/QEMU):
#   docker compose -f docker-compose.riscv64.yml up --build
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.riscv64
    platform: linux/riscv64
    image: dittobuffer/server:1.0.0-riscv64
    container_name: dittobuffer-server-riscv64
    command: ["python", "-m", "dittobuffer.runtime.http", "--config", "config/family.json"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8445:8445"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./config:/app/config:ro
      - ./protocol:/app/protocol:ro
      - ./data:/app/data
      - ./assets:/app/assets:ro
      - ./logs:/app/logs
    environment:
      TZ: Europe/Amsterdam
    healthcheck:
      test: ["CMD", "python", "-c", "import socket;s=socket.create_connection(('127.0.0.1',8445),3);s.close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  admin:
    image: dittobuffer/server:1.0.0-riscv64
    platform: linux/riscv64
    container_name: dittobuffer-admin-riscv64
    depends_on:
      server:
        condition: service_started
    command: ["python", "-m", "dittobuffer.admin.admin", "--config", "config/family.json", "--port", "8080"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./assets:/app/assets:ro
      - ./logs:/app/logs
    environment:
      TZ: Europe/Amsterdam
