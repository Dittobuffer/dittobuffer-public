[package]
name = "niantic-labs-plugin"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust stub reimplementation of libNianticLabsPlugin.so"

# Load-bearing: cargo emits libNianticLabsPlugin.so, matching the original SONAME.
# System.loadLibrary("NianticLabsPlugin") fails if this is wrong.
[lib]
name = "NianticLabsPlugin"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni-sys = "0.4"
# Message types for the dev channel only, generated by build.rs from tools/devrpc.proto.
# Not the game's protocol -- see that file for why the two are kept apart.
prost = "0.13"
# Family endpoints use certificate-verified TLS; loopback development remains HTTP.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[build-dependencies]
prost-build = "0.13"

[profile.release]
# Never unwind across an extern "C" boundary.
panic = "abort"
lto = true
opt-level = "s"
# Safe: #[no_mangle] exports live in .dynsym, which stripping preserves.
# Re-check with `nm -D` after every release build.
strip = "symbols"
